<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Iklim - PPL Digital</title>
<style>
:root { 
    --primary: #81c784; 
    --bg-dark: #121212; 
    --card-dark: #1e1e1e; 
    --text-main: #e0e0e0; 
    --blue: #64b5f6; 
    --orange: #fb8c00;
}

body { 
    font-family: 'Segoe UI', sans-serif; 
    background-color: var(--bg-dark); 
    color: var(--text-main); 
    margin: 0; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 20px; 
    padding-bottom: 80px;
}

@keyframes glowBlink {
    0% { border-color: #333; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
    50% { border-color: var(--primary); box-shadow: 0 0 15px rgba(129, 199, 132, 0.4); }
    100% { border-color: #333; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
}

.container { 
    max-width: 850px; 
    width: 100%; 
    background: var(--card-dark); 
    border-radius: 20px; 
    border: 2px solid #333; 
    overflow: hidden; 
    margin-top: 25px; 
    animation: glowBlink 3s infinite alternate; 
}

.header-bar { 
    padding: 15px; 
    text-align: center; 
    color: white; 
    font-weight: bold; 
    text-transform: uppercase;
}

.content { padding: 15px; text-align: center; }

/* Frame untuk menampilkan halaman BMKG */
.frame-bmkg {
    width: 100%;
    height: 500px;
    border: none;
    border-radius: 10px;
    background: white;
}

.caption { 
    text-align: left; 
    background: #252525; 
    padding: 15px; 
    margin-top: 15px; 
    border-radius: 10px; 
    font-size: 0.85rem; 
    line-height: 1.5; 
    border-left: 4px solid var(--primary);
}

.btn-home { 
    position: fixed; 
    top: 15px; 
    left: 15px; 
    background: var(--primary); 
    color: #121212; 
    width: 50px; 
    height: 50px; 
    border-radius: 50%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    text-decoration: none; 
    font-size: 24px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    border: 2px solid white; 
    z-index: 999; 
}
</style>
</head>
<body>

<div class="container">
    <div class="header-bar" style="background: var(--blue);">🌍 MONITOR EL-NINO (LIVE)</div>
    <div class="content">
        <img src="https://wsrv.nl/?url=www.bom.gov.au/climate/ocean/outlooks/plots/sstOutlooks.rnino34.hr.png" 
             class="grafik-img" style="width:100%; border-radius:10px;">
    </div>
</div>

<div class="container" style="animation-delay: 1.5s;">
    <div class="header-bar" style="background: var(--orange);">🗓️ PREDIKSI HUJAN (BMKG)</div>
    <div class="content" style="padding: 5px;">
        <iframe src="https://www.bmkg.go.id/iklim/prakiraan-hujan-bulanan.bmkg" 
                class="frame-bmkg"></iframe>
        
        <div class="caption">
            <b>Catatan:</b> Jika peta di atas tidak muncul, pastikan koneksi internet stabil. Halaman ini ditarik langsung dari sistem informasi iklim BMKG.
        </div>
    </div>
</div>

<a href="https://mamank757.github.io/PPL" class="btn-home">🏠</a>

</body>
</html>
