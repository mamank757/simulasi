<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Tanam Padi PRO</title>

<style>
:root {
  --primary: #81c784; 
  --bg-dark: #121212;
  --card-dark: #1e1e1e;
  --input-bg: #2d2d2d;
  --text-main: #e0e0e0;
  --text-muted: #b0b0b0;
  --orange: #ffb74d;
  --blue: #64b5f6;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  padding: 20px;
  margin: 0;
}

.container {
  background: var(--card-dark);
  max-width: 500px;
  width: 100%;
  padding: 25px;
  border-radius: 20px;
}

h2 { text-align: center; color: var(--primary); }

label { margin-top: 15px; display:block; }

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  background: var(--input-bg);
  color: white;
  border: 1px solid #444;
}

button {
  background: var(--primary);
  color: #121212;
  font-weight: bold;
}

.card {
  background: #252525;
  padding: 15px;
  margin-top: 10px;
  border-left: 4px solid var(--primary);
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
<h2>🌾 KALKULATOR PADI</h2>

<label>📅 TANGGAL TANAM</label>
<input type="date" id="tgl">

<label>🌾 VARIETAS</label>
<select id="varietas">
<option value="77">Ultra Genjah</option>
<option value="88">Sangat Genjah</option>
<option value="100" selected>Genjah</option>
<option value="112">Sedang</option>
<option value="120">Dalam</option>
</select>

<label>📐 LUAS LAHAN (Ha)</label>
<input type="number" id="luas" value="1">

<label>🏷️ NAMA LAHAN</label>
<input type="text" id="namaLahan" placeholder="Contoh: Sawah Belakang">

<button onclick="hitung()">🔍 HITUNG</button>

<div id="hasil"></div>

<h3>📋 DATA TERSIMPAN</h3>
<div id="listData"></div>

</div>

<script>
function tglFormat(t) {
  return new Date(t).toLocaleDateString('id-ID');
}

function tambahHari(tanggal, hari) {
  let d = new Date(tanggal);
  d.setDate(d.getDate() + hari);
  return d;
}

// ================= SIMPAN =================
function simpanData(tgl, varietas, luas, nama) {
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];

  data.push({
    nama: nama || "Tanpa Nama",
    tgl, varietas, luas,
    waktu: new Date().toLocaleString()
  });

  localStorage.setItem("lahanPadi", JSON.stringify(data));
  tampilData();
}

// ================= TAMPIL =================
function tampilData() {
  const list = document.getElementById("listData");
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];

  if (data.length === 0) {
    list.innerHTML = "<small>Tidak ada data</small>";
    return;
  }

  list.innerHTML = data.map((d,i)=>`
    <div class="card">
      <b>🌾 ${d.nama}</b><br>
      📅 ${tglFormat(d.tgl)}<br>
      🌱 ${d.varietas} HST<br>
      📐 ${d.luas} Ha<br><br>

      <button onclick="loadData(${i})">Buka</button>
      <button onclick="hapusData(${i})">Hapus</button>
    </div>
  `).join("");
}

// ================= LOAD =================
function loadData(i){
  let data = JSON.parse(localStorage.getItem("lahanPadi"));
  let d = data[i];

  document.getElementById("tgl").value = d.tgl;
  document.getElementById("varietas").value = d.varietas;
  document.getElementById("luas").value = d.luas;
  document.getElementById("namaLahan").value = d.nama;

  hitung();
}

// ================= HAPUS =================
function hapusData(i){
  let data = JSON.parse(localStorage.getItem("lahanPadi"));
  data.splice(i,1);
  localStorage.setItem("lahanPadi", JSON.stringify(data));
  tampilData();
}

// ================= HITUNG =================
function hitung(){
  let tgl = document.getElementById("tgl").value;
  let umur = parseInt(document.getElementById("varietas").value);
  let luas = parseFloat(document.getElementById("luas").value);
  let nama = document.getElementById("namaLahan").value;

  if(!tgl || luas<=0) return alert("Isi data dulu!");

  let tanam = new Date(tgl);

  let p1 = tambahHari(tanam, umur*0.1);
  let p2 = tambahHari(tanam, umur*0.3);
  let p3 = tambahHari(tanam, umur*0.6);

  let hasil = `
  <div class="card">Pupuk 1: ${tglFormat(p1)}</div>
  <div class="card">Pupuk 2: ${tglFormat(p2)}</div>
  <div class="card">Pupuk 3: ${tglFormat(p3)}</div>
  `;

  document.getElementById("hasil").innerHTML = hasil;

  simpanData(tgl, umur, luas, nama);
}

tampilData();
</script>

</body>
</html>
