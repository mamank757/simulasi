<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Tanam Padi PRO</title>

<style>
:root {
  --primary: #81c784; 
  --bg-dark: #121212;
  --card-dark: #1e1e1e;
  --input-bg: #2d2d2d;
  --text-main: #e0e0e0;
  --text-muted: #b0b0b0;
  --orange: #ffb74d;
  --blue: #64b5f6;
}

body {
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  padding: 20px;
  margin: 0;
}

.btn-home {
  position: fixed;
  bottom: 25px;
  right: 20px;
  background: var(--primary);
  color: #121212;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  font-size: 26px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  z-index: 9999;
  border: 2px solid white;
}

.container {
  background: var(--card-dark);
  max-width: 500px;
  width: 100%;
  padding: 25px;
  border-radius: 20px;
}

h2 { text-align: center; color: var(--primary); }

label { margin-top: 15px; display:block; color: var(--text-muted); }

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  background: var(--input-bg);
  color: white;
  border: 1px solid #444;
}

button {
  background: var(--primary);
  color: #121212;
  font-weight: bold;
  margin-top: 20px;
}

.result { margin-top: 20px; display: none; }

.card {
  background: #252525;
  padding: 15px;
  margin-top: 10px;
  border-left: 4px solid var(--primary);
  border-radius: 10px;
}

.panen { border-left-color: var(--orange); }
.terlewat { border-left-color: #e57373; }
.sekarang { border-left-color: #ffd54f; }
.akan { border-left-color: #81c784; }

.info-pupuk {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 5px;
}
</style>
</head>

<body>

<a href="https://mamank757.github.io/petani" class="btn-home">🏠</a>

<div class="container">
<h2>🌾 KALKULATOR PADI</h2>

<label>📅 TANGGAL TANAM</label>
<input type="date" id="tgl">

<label>🌾 VARIETAS PADI</label>
<select id="varietas">
<option value="77">Ultra Genjah (70-84 HST)</option>
<option value="88">Sangat Genjah (85-90 HST)</option>
<option value="100" selected>Genjah (91-105 HST)</option>
<option value="112">Sedang (106-115 HST)</option>
<option value="120">Dalam (116-125 HST)</option>
</select>

<label>📐 LUAS LAHAN (HEKTAR)</label>
<input type="number" id="luas" step="0.1" value="1">

<button onclick="hitung()">🔍 ANALISIS SEKARANG</button>

<div class="result" id="hasil"></div>

<h3 style="margin-top:30px;">📋 DATA LAHAN TERSIMPAN</h3>
<div id="listData"></div>

</div>

<script>
function tglFormat(t) {
  return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}

function tambahHari(tanggal, hari) {
  let d = new Date(tanggal);
  d.setDate(d.getDate() + hari);
  return d;
}

function statusKegiatanObj(tanggal) {
  const hariIni = new Date();
  hariIni.setHours(0,0,0,0);

  const tgl = new Date(tanggal);
  tgl.setHours(0,0,0,0);

  const selisih = Math.floor((tgl - hariIni) / (1000*60*60*24));

  if (selisih < -2) return {text:"❌ Terlewat", class:"terlewat"};
  if (selisih >= -2 && selisih <= 2) return {text:"⚠️ Sekarang", class:"sekarang"};
  return {text:"⏳ Akan Datang", class:"akan"};
}

function simpanData(tgl, varietas, luas) {
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];

  const sudahAda = data.some(d => 
    d.tgl === tgl && d.varietas == varietas && d.luas == luas
  );

  if (sudahAda) return;

  data.push({
    tgl: tgl,
    varietas: varietas,
    luas: luas,
    waktu: new Date().toLocaleString()
  });

  localStorage.setItem("lahanPadi", JSON.stringify(data));
  tampilData();
}

function tampilData() {
  const list = document.getElementById("listData");
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];

  if (data.length === 0) {
    list.innerHTML = "<small>Tidak ada data tersimpan</small>";
    return;
  }

  list.innerHTML = data.map((d, i) => `
    <div class="card">
      <b>🌾 Lahan ${i+1}</b>
      📅 Tanam: ${tglFormat(d.tgl)}<br>
      🌱 Varietas: ${d.varietas} HST<br>
      📐 Luas: ${d.luas} Ha<br>
      <small>Disimpan: ${d.waktu}</small><br><br>

      <button onclick="loadData(${i})">🔍 Buka</button>
      <button onclick="hapusData(${i})" style="background:#e57373;">🗑️ Hapus</button>
    </div>
  `).join("");
}

function loadData(index) {
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];
  const d = data[index];

  document.getElementById("tgl").value = d.tgl;
  document.getElementById("varietas").value = d.varietas;
  document.getElementById("luas").value = d.luas;

  hitung();
}

function hapusData(index) {
  let data = JSON.parse(localStorage.getItem("lahanPadi")) || [];

  if (confirm("Hapus data ini?")) {
    data.splice(index, 1);
    localStorage.setItem("lahanPadi", JSON.stringify(data));
    tampilData();
  }
}

function hitung() {
  const tglVal = document.getElementById("tgl").value;
  const umur = parseInt(document.getElementById("varietas").value);
  const luas = parseFloat(document.getElementById("luas").value) || 0;

  if (!tglVal) { alert("Pilih tanggal tanam!"); return; }
  if (luas <= 0) { alert("Luas lahan harus lebih dari 0!"); return; }

  const keyNotif = "notif_" + tglVal + "_" + umur;

  const tanam = new Date(tglVal);
  const hariIni = new Date();
  const umurSekarang = Math.floor((hariIni - tanam)/(1000*60*60*24));

  const p1_hst = Math.round(umur * 0.07);  // ±7%
const p2_hst = Math.round(umur * 0.25);  // ±25%
let p3_hst = Math.round(umur * 0.65);    // ±65%

if (p3_hst <= p2_hst) p3_hst = p2_hst + 10;

const p1 = tambahHari(tanam, p1_hst);
const p2 = tambahHari(tanam, p2_hst);
const p3 = tambahHari(tanam, p3_hst);

  const s1 = statusKegiatanObj(p1);
  const s2 = statusKegiatanObj(p2);
  const s3 = statusKegiatanObj(p3);

  let notif = [];
  if (s1.class === "sekarang") notif.push("Pupuk Tahap I");
  if (s2.class === "sekarang") notif.push("Pupuk Tahap II");
  if (s3.class === "sekarang") notif.push("Pupuk Tahap III");

  if (notif.length > 0 && !sessionStorage.getItem(keyNotif)) {
    alert("⚠️ Hari ini jadwal: " + notif.join(", "));
    sessionStorage.setItem(keyNotif, "true");
  }

  // dosis otomatis
  const urea1 = (100 * luas).toFixed(1);
  const npk1 = (150 * luas).toFixed(1);
  const urea2 = (100 * luas).toFixed(1);
  const npk2 = (100 * luas).toFixed(1);
  const npk3 = (100 * luas).toFixed(1);
  const kcl3 = (50 * luas).toFixed(1);

  document.getElementById("hasil").innerHTML = `
  <div class="card" style="border-left-color: var(--blue)">
    <b>📊 STATUS TANAMAN</b>
    Umur: ${umurSekarang} HST
  </div>

  <div class="card ${s1.class}">
    <b>🧪 PUPUK I</b>
    📅 ${tglFormat(p1)} <br>
    <small>${s1.text}</small>
    <div class="info-pupuk">
      ✔ Urea ${urea1} kg<br>
      ✔ NPK ${npk1} kg
    </div>
  </div>

  <div class="card ${s2.class}">
    <b>🧪 PUPUK II</b>
    📅 ${tglFormat(p2)} <br>
    <small>${s2.text}</small>
    <div class="info-pupuk">
      ✔ Urea ${urea2} kg<br>
      ✔ NPK ${npk2} kg
    </div>
  </div>

  <div class="card ${s3.class}">
    <b>🧪 PUPUK III</b>
    📅 ${tglFormat(p3)} <br>
    <small>${s3.text}</small>
    <div class="info-pupuk">
      ✔ NPK ${npk3} kg<br>
      ✔ KCl ${kcl3} kg
    </div>
  </div>
  `;

  document.getElementById("hasil").style.display = "block";
  simpanData(tglVal, umur, luas);
}

tampilData();
</script>

</body>
</html>
